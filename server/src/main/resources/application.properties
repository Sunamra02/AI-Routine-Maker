# ==================================================
# SERVER CONFIGURATION
# ==================================================
server.port=8080

# ==================================================
# MYSQL DATABASE CONFIGURATION
# ==================================================
# Note: Ensure MySQL is running on port 3306.
# Change YOUR_MYSQL_PASSWORD to your actual MySQL database password!
spring.datasource.url=jdbc:mysql://localhost:3306/ai_routine_maker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# JPA / HIBERNATE CONFIGURATION
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
